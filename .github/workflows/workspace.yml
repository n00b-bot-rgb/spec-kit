name: Workspace CI

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "real-work/**"
      - ".github/workflows/workspace.yml"
      - "workflows/**"
      - "pyproject.toml"
  push:
    branches:
      - "main"
      - "feat/research-dashboard-osint-pipeline"
    paths:
      - "real-work/**"
      - ".github/workflows/workspace.yml"
      - "workflows/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: real-work
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace dependencies
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt

      - name: Lint workspace scripts and tests
        run: uvx ruff@0.15.0 check scripts tests

      - name: Validate workspace configuration
        run: .venv/bin/python scripts/verify_workspace.py

      - name: Validate synthetic evidence
        run: .venv/bin/python scripts/validate_evidence.py

      - name: Run workspace regression and wiring tests
        run: .venv/bin/python -m unittest discover -s tests -v
